source: address.yaml
type: kafka
seed:
  type: embedded
  value: 12345
conf:
  bootstrap: kafka.example.com:9093
  topic: addresses
  batch_size: 1000
  linger_ms: 10
  compression: gzip
  acks: all
  sync: false
  security_protocol: SASL_SSL
  sasl_mechanism: SCRAM-SHA-512
  # SeedStream builds sasl.jaas.config from these; both honour ${VAR} / ${SECRET:path}
  username: ${KAFKA_USER}
  password: ${KAFKA_PASSWORD}
  ssl_truststore_location: /path/to/truststore.jks
  ssl_truststore_password: ${KAFKA_TRUSTSTORE_PASSWORD}
