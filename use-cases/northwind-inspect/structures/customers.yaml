name: "customers"
data:
  customer_id:
    datatype: "serial[1..99999]"  # text key generated as numeric strings — max 99999 rows
  company_name:
    datatype: "char[1..40]"
  contact_name:
    datatype: "full_name"  # realism (optional): fits varchar(30)
    nullable: 0.05
  contact_title:
    datatype: "char[1..30]"
    nullable: 0.05
  address:
    datatype: "address"  # guessed from column name — verify
    max_length: 60
    nullable: 0.05
  city:
    datatype: "city"  # guessed from column name — verify
    max_length: 15
    nullable: 0.05
  region:
    datatype: "char[1..15]"
    nullable: 0.05
  postal_code:
    datatype: "postal_code"  # guessed from column name — verify
    max_length: 10
    nullable: 0.05
  country:
    datatype: "country"  # guessed from column name — verify
    max_length: 15
    nullable: 0.05
  phone:
    datatype: "phone_number"  # guessed from column name — verify
    max_length: 24
    nullable: 0.05
  fax:
    datatype: "char[1..24]"
    nullable: 0.05
