name: "order_details"
data:
  order_id:
    datatype: "ref[orders.order_id, unique=pk]"
  product_id:
    datatype: "ref[products.product_id, unique=pk]"
  unit_price:
    datatype: "decimal[2.00..265.00]"  # realism (optional): Northwind-like range
  quantity:
    datatype: "int[1..120]"  # realism (optional): Northwind-like range
  discount:
    datatype: "decimal[0.00..0.25]"  # realism (optional)
