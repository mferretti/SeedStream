name: "orders"
data:
  order_id:
    datatype: "serial[1..2147483647]"  # hand edit (scale.sql): inspected as serial[1..32767] (smallint); scale.sql widens order_id to integer
  customer_id:
    datatype: "ref[customers.customer_id]"
    nullable: 0.05
  employee_id:
    datatype: "ref[employees.employee_id]"
    nullable: 0.05
  order_date:
    datatype: "date[1996-07-01..2026-06-30]"  # realism (optional): Northwind-like range
    nullable: 0.05
  required_date:
    datatype: "date[1996-07-01..2026-06-30]"  # realism (optional): Northwind-like range
    nullable: 0.05
  shipped_date:
    datatype: "date[1996-07-01..2026-06-30]"  # realism (optional): Northwind-like range
    nullable: 0.05
  ship_via:
    datatype: "ref[shippers.shipper_id]"
    nullable: 0.05
  freight:
    datatype: "decimal[0.02..1007.64]"  # realism (optional): Northwind-like range
    nullable: 0.05
  ship_name:
    datatype: "full_name"  # realism (optional): fits varchar(40)
    nullable: 0.05
  ship_address:
    datatype: "address"  # guessed from column name — verify
    max_length: 60
    nullable: 0.05
  ship_city:
    datatype: "city"  # guessed from column name — verify
    max_length: 15
    nullable: 0.05
  ship_region:
    datatype: "char[1..15]"
    nullable: 0.05
  ship_postal_code:
    datatype: "postal_code"  # guessed from column name — verify
    max_length: 10
    nullable: 0.05
  ship_country:
    datatype: "country"  # guessed from column name — verify
    max_length: 15
    nullable: 0.05
