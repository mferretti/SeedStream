name: "suppliers"
data:
  supplier_id:
    datatype: "serial"
  company_name:
    datatype: "char[1..40]"
  contact_name:
    datatype: "full_name"  # realism (optional): fits varchar(30)
  contact_title:
    datatype: "char[1..30]"
  address:
    datatype: "street_name"  # hand edit (#440): `address` hint exceeds varchar(60)
  city:
    datatype: "enum[Aachen,Barcelona,Berlin,Bern,Boise,Bruxelles,Buenos Aires,Caracas,Graz,Helsinki,Kobenhavn,Lisboa,London,Lyon,Madrid,Marseille,Montreal,Munchen,Oulu,Paris,Portland,Rio de Janeiro,Salzburg,Sao Paulo,Seattle,Stavern,Torino,Vancouver,Warszawa]"  # hand edit (#440): `city` hint exceeds varchar(15)
  region:
    datatype: "char[1..15]"
  postal_code:
    datatype: "postal_code"  # guessed from column name — verify
  country:
    datatype: "enum[Argentina,Austria,Belgium,Brazil,Canada,Denmark,Finland,France,Germany,Ireland,Italy,Mexico,Norway,Poland,Portugal,Spain,Sweden,Switzerland,UK,USA,Venezuela]"  # hand edit (#440): `country` hint exceeds varchar(15)
  phone:
    datatype: "phone_number"  # guessed from column name — verify
  fax:
    datatype: "char[1..24]"
  homepage:
    datatype: "char[1..500]"
