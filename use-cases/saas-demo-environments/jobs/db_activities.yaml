# structures_path auto-resolves to ../structures/ (dir ends in "jobs").
source: activities.yaml
type: database
seed:
  type: embedded
  value: 82005              # fixed → identical demo dataset on every reseed
conf:
  jdbc_url: "jdbc:postgresql://localhost:5432/demodb"
  username: "demouser"
  password: "${DB_PASSWORD}"
  table: "activities"
  batch_size: 500
  transaction_strategy: per_batch
  truncate_before_insert: true   # ⚠️ DESTRUCTIVE — disposable demo database only
  restart_identity: true         # ids restart at 1, matching a fresh contacts/deals pool each reseed
