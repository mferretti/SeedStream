# account_id/owner_id reference the accounts/users pools — ranges MUST match the row counts in seed.sh.
name: deals
data:
  account_id:
    datatype: ref[accounts.id, 1..100]
  owner_id:
    datatype: ref[users.id, 1..20]
  name:
    datatype: product_name
  stage:
    datatype: enum[lead,qualified,proposal,negotiation,closed_won,closed_lost]
  amount:
    datatype: decimal[1000.00..250000.00]
  close_date:
    datatype: date[2024-01-01..2025-12-31]
